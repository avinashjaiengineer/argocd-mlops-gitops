# Level 2 - Helm. Not used by Argo CD yet (the Application points at k8s/).
# Override per environment with values-dev.yaml / values-prod.yaml.

replicaCount: 2

image:
  repository: 482545366109.dkr.ecr.us-east-1.amazonaws.com/argocd-ml-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  APP_VERSION: "1.0.0"

ingress:
  # Requires the AWS Load Balancer Controller.
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
