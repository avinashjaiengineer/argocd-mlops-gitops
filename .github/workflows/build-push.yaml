name: Build and push ML API

# Runs only when application code changes. The manifest commit made by this
# workflow touches k8s/ only, so it does not re-trigger itself.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write   # commit the new image tag back to k8s/deployment.yaml
  id-token: write   # OIDC login to AWS (no long-lived access keys)

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: argocd-ml-api

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Override with a repo variable AWS_ROLE_ARN
          # (Settings -> Secrets and variables -> Actions -> Variables).
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::482545366109:role/gha-argocd-mlops-ecr-push' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update manifest with new image tag
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          sed -i -E "s|^(\s*image:\s*).*/${ECR_REPOSITORY}:.*$|\1${IMAGE}|" k8s/deployment.yaml
          git diff --exit-code k8s/deployment.yaml && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy ml-api ${GITHUB_SHA::7}"
          git push
